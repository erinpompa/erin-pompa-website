<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Erin Pompa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Hanken+Grotesk:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #ff66c4;
      --lime: #c1f944;
      --sky:  #38b6ff;
      --ink:  #161413;
    }

    html, body {
      height: 100%;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      font-family: 'Hanken Grotesk', system-ui, sans-serif;
      background: var(--ink);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px 36px;
      position: relative;
      overflow-x: hidden;
    }

    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: linear-gradient(160deg, #2a1a24 0%, #0f0d0c 60%);
    }
    .yt-wrap {
      position: absolute;
      top: 50%; left: 50%;
      width: max(100vw, 177.78vh);
      height: max(100vh, 56.25vw);
      transform: translate(-50%, -50%);
    }
    #hero-yt { width: 100%; height: 100%; }

    .scrim {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        to bottom,
        rgba(22,20,19,0.72) 0%,
        rgba(22,20,19,0.52) 45%,
        rgba(22,20,19,0.78) 100%
      );
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .name {
      font-family: 'Archivo', system-ui, sans-serif;
      font-weight: 900;
      font-size: clamp(58px, 18vw, 80px);
      line-height: 0.86;
      text-transform: uppercase;
      letter-spacing: -0.045em;
      color: #fff;
      margin-bottom: 12px;
    }

    .bio-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 10px;
    }
    .bio-life {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 22px;
      color: var(--lime);
      line-height: 1;
    }
    .bio-title {
      font-family: 'Archivo', system-ui, sans-serif;
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #fff;
    }
    .bio-vibes {
      font-family: 'Hanken Grotesk', system-ui, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.6);
    }

    .intro {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      color: rgba(255,255,255,0.88);
      margin-bottom: 24px;
    }
    .script {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 1.6em;
      line-height: 0.9;
      color: var(--lime);
      display: inline-block;
      vertical-align: -0.12em;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 17px 20px 15px;
      border-radius: 8px;
      border: 2.5px solid var(--ink);
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
      box-shadow: 4px 4px 0 rgba(22,20,19,0.85);
    }
    .btn:hover  { transform: translateY(-2px); box-shadow: 6px 6px 0 rgba(22,20,19,0.9); }
    .btn:active { transform: translateY(1px);  box-shadow: 2px 2px 0 rgba(22,20,19,0.8); }

    .btn-lime { background: var(--lime); color: var(--ink); }
    .btn-pink { background: var(--pink); color: var(--ink); }

    .btn-label {
      font-family: 'Archivo', system-ui, sans-serif;
      font-weight: 800;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .btn-sub {
      font-family: 'Hanken Grotesk', system-ui, sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: 5px;
      opacity: 0.7;
    }

    .socials {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }
    .soc {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1.5px solid rgba(255,255,255,0.28);
      display: grid;
      place-items: center;
      color: #fff;
      text-decoration: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .soc:hover { border-color: #fff; background: rgba(255,255,255,0.1); }
    .soc-handle {
      display: flex;
      align-items: center;
      padding: 0 12px;
      height: 44px;
      border-radius: 999px;
      border: 1.5px solid rgba(255,255,255,0.28);
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-family: 'Hanken Grotesk', system-ui, sans-serif;
      font-weight: 700;
      font-size: 13px;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .soc-handle:hover { border-color: #fff; background: rgba(255,255,255,0.1); color: #fff; }
  </style>
</head>
<body>

  <div class="video-bg" aria-hidden="true">
    <div class="yt-wrap"><div id="hero-yt"></div></div>
  </div>
  <div class="scrim" aria-hidden="true"></div>

  <div class="container">

    <h1 class="name">Erin<br>Pompa</h1>

    <div class="bio-block">
      <p class="bio-life">✨ Living my best life at 45</p>
      <p class="bio-title">🎤 Public Speaker | Wife | Dog Mom</p>
      <p class="bio-vibes">Faith &bull; Fitness &bull; Fashion &bull; Real Life</p>
    </div>

    <p class="intro">
      Hi, I'm Erin &mdash; and I've got <span class="script">a lot to say.</span>
    </p>

    <div class="links">

      <a class="btn btn-lime"
         href="https://shopmy.us/shop/erinpspeaks"
         target="_blank" rel="noopener">
        <span class="btn-label">🛍️ Shop My Faves ✨</span>
        <span class="btn-sub">Erin-approved picks &rarr;</span>
      </a>

      <a class="btn btn-pink"
         href="https://erinpompa.com/speaking.html"
         target="_blank" rel="noopener">
        <span class="btn-label">Learn More About My Speaking &rarr;</span>
      </a>

    </div>

    <div class="socials">
      <a class="soc" href="https://www.instagram.com/theerinpompa/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a class="soc-handle" href="https://www.instagram.com/theerinpompa/" target="_blank" rel="noopener">
        @theerinpompa
      </a>
      <a class="soc" href="https://www.linkedin.com/in/erinpompa/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7H10V9h4v1.8A6 6 0 0 1 16 8z"/>
          <rect x="2" y="9" width="4" height="12"/>
          <circle cx="4" cy="4" r="2"/>
        </svg>
      </a>
    </div>

  </div>

  <script>
    (function() {
      var VID = "hykkXiX7rwc";
      var watchdog;
      function init() {
        if (!window.YT || !window.YT.Player) return;
        new window.YT.Player("hero-yt", {
          videoId: VID,
          playerVars: { autoplay:1, mute:1, controls:0, loop:1, playlist:VID,
            playsinline:1, modestbranding:1, rel:0, disablekb:1, fs:0,
            iv_load_policy:3, showinfo:0 },
          events: {
            onReady: function(e) {
              var p = e.target; p.mute(); p.playVideo();
              try { p.getIframe().setAttribute("tabindex","-1"); } catch(x){}
              clearInterval(watchdog);
              watchdog = setInterval(function(){
                try { var d=p.getDuration(); if(d>0&&p.getCurrentTime()>=d-0.35) p.seekTo(0,true); } catch(x){}
              }, 250);
            },
            onStateChange: function(e) {
              var S = window.YT.PlayerState;
              if (e.data===S.ENDED) { e.target.seekTo(0,true); e.target.playVideo(); }
              if (e.data===S.PAUSED) { e.target.playVideo(); }
            }
          }
        });
      }
      if (window.YT && window.YT.Player) { init(); }
      else {
        var prev = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = function(){ if(prev) prev(); init(); };
        if (!document.getElementById("yt-api")) {
          var s = document.createElement("script");
          s.id = "yt-api"; s.src = "https://www.youtube.com/iframe_api";
          document.body.appendChild(s);
        }
      }
    })();
  </script>

</body>
</html>
